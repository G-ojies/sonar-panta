# Runs the Sonar radar refresh + agent tick on a schedule, writing to the same Upstash
# store the Vercel deployment reads. Keeps the heavy path (~100 s of rate-limited Panta
# calls) off serverless functions and works on any Vercel plan.
name: sonar-tick
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
concurrency:
  group: sonar-tick
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PANTA_API_BASE_URL: https://live-api.panta.market/api/v1
      PANTA_API_KEY: ${{ secrets.PANTA_API_KEY }}
      KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
      KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
      NEXT_PUBLIC_SOLANA_RPC: ${{ secrets.SOLANA_RPC || 'https://api.mainnet-beta.solana.com' }}
      SONAR_AGENT_MODE: ${{ vars.SONAR_AGENT_MODE || 'paper' }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$PANTA_API_KEY" ] || [ -z "$KV_REST_API_URL" ]; then
            echo "::notice::PANTA_API_KEY / KV_REST_API_URL not set; skipping tick (see docs/DEPLOY.md)"; echo "ok=false" >> "$GITHUB_OUTPUT"
          else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with: { node-version: 20, cache: npm }
      - run: npm ci
        if: steps.check.outputs.ok == 'true'
      - name: Refresh radar, run agent, backtest
        if: steps.check.outputs.ok == 'true'
        run: npm run agent
