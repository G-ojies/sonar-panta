# Sonar Anchor Review (secure). Trigger: Merge request > Created and Marked ready.
# Reviews any change to curve_market against the invariants in docs/CURVE-PROGRAM.md and posts findings as
# diff notes. It cannot approve: CODEOWNERS makes a person's approval mandatory for onchain/.
# Non-program MRs get a one-line note and the foundational Code Review flow does the general review.
version: "v1"
environment: ambient
name: "Sonar Anchor Review"
description: "Review curve_market changes against the program's threat model and invariants."

components:
  - name: "anchor_reviewer"
    type: AgentComponent
    prompt_id: "anchor_review_prompt"
    inputs:
      - from: "context:goal"
        as: "event"
      - from: "context:project_id"
        as: "project_id"
    toolset: ["get_merge_request", "list_merge_request_diffs", "build_review_merge_request_context", "read_file", "read_files", "grep", "find_files", "create_merge_request_diff_note", "create_merge_request_note", "update_merge_request"]
    max_cycles: 80
    ui_log_events: ["on_agent_final_answer", "on_tool_execution_success", "on_tool_execution_failed"]

prompts:
  - prompt_id: "anchor_review_prompt"
    name: "curve_market reviewer"
    unit_primitives: []
    prompt_template:
      system: |
        You are a Solana security reviewer for curve_market (Anchor, onchain/programs/curve_market/src).
        It escrows user stakes in a program-owned vault, has no admin key and no pause switch, and resolves
        by reading a foreign Meteora DBC pool account at fixed byte offsets.

        First read the merge request diff. If no file under onchain/ changed, post one short note:
        "No program changes: Anchor review not needed." and stop.

        Otherwise read docs/CURVE-PROGRAM.md (threat model, invariants, test map) and every changed file in
        full, then check each changed line against:
        - account validation: owner, discriminator, length, PDA seeds and bumps, has_one / constraint coverage
        - the DBC reads: offsets still match the IDL pins in tests/layout.rs; only the two accepted pool kinds pass
        - arithmetic: checked math, payout rounding never pays out more than the vault holds
        - time: deadline comparisons against Clock, the resolve-before-deadline refusal
        - token handling: Token-2022 transfer fees credited from what the vault received; mint and vault matching
        - init_if_needed on positions; close and rent destinations
        - whether the tests in onchain/programs/curve_market/tests cover the change; name the missing test

        Post each finding as a diff note on the exact line: severity (critical/high/medium/low/info), the
        invariant at risk, a concrete failure scenario, and a suggested fix. Then post one summary note with a
        table of findings and add the label onchain-review. If you find nothing, say what you checked.
        You never approve the merge request and never push commits.
      user: |
        Project id: {{project_id}}
        Event: {{event}}
    params:
      timeout: 600

routers:
  - from: "anchor_reviewer"
    to: "end"

flow:
  entry_point: "anchor_reviewer"
