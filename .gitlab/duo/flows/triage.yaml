# Sonar Triage (plan + create). Trigger: Work item > Created.
# Reads a new issue, classifies it, writes acceptance criteria and labels. A low-risk change to the web
# app goes straight to a builder agent that opens a merge request. Anything touching onchain/ stops
# here with a note: program changes are written and approved by a person.
version: "v1"
environment: ambient
name: "Sonar Triage"
description: "Classify a new Sonar issue, add acceptance criteria and labels, and open an MR for low-risk web changes."

components:
  - name: "triage"
    type: AgentComponent
    prompt_id: "triage_prompt"
    response_schema_id: "triage_result"
    inputs:
      - from: "context:goal"
        as: "event"
      - from: "context:project_id"
        as: "project_id"
    toolset: ["get_work_item", "get_issue", "list_issues", "read_file", "find_files", "grep", "update_issue", "create_issue_note"]
    max_cycles: 40
    ui_log_events: ["on_agent_final_answer", "on_tool_execution_success", "on_tool_execution_failed"]

  - name: "builder"
    type: AgentComponent
    prompt_id: "builder_prompt"
    inputs:
      - from: "context:triage.final_answer"
        as: "plan"
      - from: "context:project_id"
        as: "project_id"
    toolset: ["read_file", "read_files", "find_files", "grep", "list_dir", "edit_file", "create_file_with_contents", "run_command", "run_git_command", "create_merge_request", "create_issue_note"]
    max_cycles: 120
    ui_log_events: ["on_agent_final_answer", "on_tool_execution_success", "on_tool_execution_failed"]

response_schemas:
  - schema_id: "triage_result"
    definition:
      type: object
      properties:
        issue_iid: { type: integer }
        area: { type: string, enum: ["web", "data", "onchain", "docs", "unclear"] }
        risk: { type: string, enum: ["low", "medium", "high"] }
        route: { type: string, enum: ["build", "human"], description: "build only when area is web or docs AND risk is low" }
        acceptance_criteria: { type: array, items: { type: string } }
        files_likely: { type: array, items: { type: string } }
        summary: { type: string }
      required: [issue_iid, area, risk, route, acceptance_criteria, summary]

prompts:
  - prompt_id: "triage_prompt"
    name: "Sonar triage"
    unit_primitives: []
    prompt_template:
      system: |
        You triage issues for Sonar for Panta: a Next.js signal desk for on-chain prediction markets (src/),
        a data tick that writes to Upstash (scripts/agent.ts, src/lib/radar.ts, src/lib/backtest.ts), and
        curve_market, an Anchor program that escrows user funds (onchain/programs/curve_market).
        Read the issue and the code it touches. Then:
        1. Pick the area. Anything under onchain/ is "onchain". Changes to how the radar, backtest or store
           write data are "data".
        2. Pick the risk. onchain is always high. data is at least medium. A copy, style or small UI fix is low.
        3. route = "build" only for web or docs with low risk. Everything else is "human".
        4. Post one comment on the issue with the area, risk, 3 to 6 testable acceptance criteria and the files
           likely to change. Add the labels area::<area> and risk::<risk>. If route is human, say a person picks it up.
        Never ask questions: nobody is there to answer. Never touch secrets or CI variables.
      user: |
        Project id: {{project_id}}
        Event: {{event}}
    params:
      timeout: 300

  - prompt_id: "builder_prompt"
    name: "Sonar builder"
    unit_primitives: []
    prompt_template:
      system: |
        You implement a small, low-risk change to the Sonar web app that triage has already scoped.
        Rules:
        - Work on a new branch named guard/issue-<iid>. Never commit to the default branch.
        - Never edit anything under onchain/, .gitlab-ci.yml, .gitlab/ or any file with secrets. If the change
          needs any of those, stop and comment on the issue instead.
        - Match the surrounding code style. Keep the change minimal.
        - Run `npm ci` once, then `npm run typecheck && npm test` before you commit. If they fail, fix or stop.
        - Open a merge request that says "Closes #<iid>", lists what changed and how each acceptance
          criterion is met. Then comment the MR link on the issue.
      user: |
        Project id: {{project_id}}
        Triage result: {{plan}}
    params:
      timeout: 600

routers:
  - from: "triage"
    condition:
      input: "context:triage.final_answer.route"
      routes:
        "build": "builder"
        "default_route": "end"
  - from: "builder"
    to: "end"

flow:
  entry_point: "triage"
